<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항</title>
    <script>
      if (new URLSearchParams(window.location.search).get("embedded") === "1") {
        document.documentElement.classList.add("is-embedded");
      }
    </script>
    <link rel="stylesheet" href="boards.css?v=20260830r3" />
  </head>
  <body data-board-key="notice" data-board-name="공지사항" data-board-type="notice">
    <main class="board-shell">
      <div class="board-grid">
        <section class="board-card">
          <div class="board-card-head">
            <div>
              <h1>공지 목록</h1>
              <p>제목을 클릭하면 상세 내용을 볼 수 있습니다.</p>
            </div>
            <div class="board-toolbar">
              <div class="board-count">총 3건</div>
              <button class="board-action write-button" type="button">공지 작성</button>
            </div>
          </div>

          <div class="board-admin-panel hidden">
            <form class="board-form admin-form">
              <h3>관리자 로그인</h3>
              <label>비밀번호<input name="adminPassword" type="password" placeholder="비밀번호 입력" required /></label>
              <div class="board-actions admin-form-actions">
                <button class="board-action" type="submit">로그인</button>
                <button class="board-cancel admin-cancel" type="button">닫기</button>
              </div>
            </form>
          </div>

          <div class="board-write-panel hidden">
            <form class="board-form write-form">
              <h3>새 공지사항 작성</h3>
              <div class="board-form-grid">
                <label>작성자<input name="author" type="text" placeholder="작성자" required /></label>
                <label class="notice-password-field hidden">비밀번호<input name="password" type="password" placeholder="글 확인용 비밀번호" /></label>
              </div>
              <label>제목<input name="title" type="text" placeholder="제목을 입력해 주세요" required /></label>
              <label>내용<textarea name="content" rows="7" placeholder="상세 내용을 입력해 주세요" data-rich-text="true" required></textarea></label>
              <label class="board-secret"><input name="pinned" type="checkbox" /> 상단 고정 공지로 등록</label>
              <label class="board-secret"><input name="secret" type="checkbox" /> 비밀글 등록</label>
              <div class="board-actions write-actions">
                <button class="board-action" type="submit">등록하기</button>
                <button class="board-cancel write-cancel" type="button">취소</button>
              </div>
            </form>
          </div>

          <table>
            <thead>
              <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
              </tr>
            </thead>
            <tbody class="board-list">
              <tr>
                <td>3</td>
                <td><button class="row-link" type="button" data-post-id="notice-3"><span class="row-link-text">5월 연휴 상담 운영 일정 안내</span></button></td>
                <td>시그니처행정사</td>
                <td>2026-04-30</td>
              </tr>
              <tr>
                <td>2</td>
                <td><button class="row-link" type="button" data-post-id="notice-2"><span class="row-link-text">의료기기 컨설팅 서류 접수 방식 변경 안내</span></button></td>
                <td>시그니처행정사</td>
                <td>2026-04-22</td>
              </tr>
              <tr>
                <td>1</td>
                <td><button class="row-link" type="button" data-post-id="notice-1"><span class="row-link-text">홈페이지 고객지원 게시판 개설 안내</span></button></td>
                <td>시그니처행정사</td>
                <td>2026-04-01</td>
              </tr>
            </tbody>
          </table>

          <div class="board-empty hidden">등록된 게시글이 없습니다.</div>

          <article class="post-view hidden">
            <div class="post-view-head">
              <div>
                <p class="post-view-meta"></p>
                <h3 class="post-view-title"></h3>
              </div>
              <div class="post-view-actions">
                <button class="post-edit hidden" type="button">수정</button>
                <button class="post-delete hidden" type="button">삭제</button>
              </div>
            </div>
            <div class="post-view-body"></div>
          </article>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/supabase-config.js?v=20260516a"></script>
    <script src="./assets/rich-text-editor.js?v=20260830r3"></script>
    <script src="boards.js?v=20260830r1"></script>
    <script src="./assets/protect-images.js"></script>
  </body>
</html>
